<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Average Calculator</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <h2>Average Calculator</h2>

    <label for="testCases">Select a Test Case:</label>
    <select id="testCases" onchange="loadTestCase()">
        <option value="" disabled selected>-- Choose a scenario --</option>
            <option value="(5, 10, 15)/3">Success: Standard Average</option>
            <option value="(5, 8, 12, 4, 10.0)/5">Success: Decimal in List</option>
            <option value="(1.5, 2.5, 3.0, 4)/4">Success: Multiple Decimals</option>
            <option value="(100, 200, 300)/3">Success: Larger Integers</option>

            <option value="()/0">Semantic Error: Empty List</option>
            <option value="(5, 10, 15)/2">Semantic Error: Denominator Mismatch</option>

            <option value="(5, 10, 15)/">Syntax Error: Missing Denominator</option>
            <option value="(5, 10, 15)3">Syntax Error: Missing '/'</option>
            <option value="(5,, 10)/2">Syntax Error: Extra Comma</option>
            <option value="(5, 10, a)/3">Lexical Error: Unknown Character 'a'</option>
            <option value="(1, 2, 3.)/3">Lexical Error: Bad Decimal '3.'</option>
            <option value="(1, 2, 3)/3.">Lexical Error: Bad Decimal '3.'</option>
      </select>

    <label for="code">Input Expression:</label>
    <textarea id="code" rows="4">(1, 2, 3)/3</textarea>
    
    <button id="runBtn">Execute</button>

    <h3>Output Terminal</h3>
    <pre id="output">Results will appear here...</pre>
  </div>

  <script>
    function loadTestCase() {
      const select = document.getElementById('testCases');
      const textarea = document.getElementById('code');
      if (select.value) {
        textarea.value = select.value;
      }
    }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
